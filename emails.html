```html
{% extends "base.html" %}

{% block title %}
    Email History
{% endblock %}

{% block content %}

<!-- Page Header -->
<h1 class="mb-4">
    Email History
</h1>


<!-- Filter Form -->
<form class="row g-2 mb-3" method="get">

    <!-- Category Filter -->
    <div class="col-md-4">

        <select
            name="category"
            class="form-select"
        >

            <option value="">
                All Categories
            </option>

            {% for c in [
                'Security',
                'Job/Internship',
                'Important',
                'Promotional',
                'Spam',
                'Normal'
            ] %}

                <option
                    value="{{ c }}"
                    {{ 'selected' if selected_category == c else '' }}
                >
                    {{ c }}
                </option>

            {% endfor %}

        </select>

    </div>


    <!-- Priority Filter -->
    <div class="col-md-4">

        <select
            name="priority"
            class="form-select"
        >

            <option value="">
                All Priorities
            </option>

            {% for p in [
                'HIGH',
                'MEDIUM',
                'LOW'
            ] %}

                <option
                    value="{{ p }}"
                    {{ 'selected' if selected_priority == p else '' }}
                >
                    {{ p }}
                </option>

            {% endfor %}

        </select>

    </div>


    <!-- Filter Button -->
    <div class="col-md-2">

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Filter
        </button>

    </div>

</form>


<!-- Email History Table -->
<div class="table-responsive">

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Time</th>
                <th>Sender</th>
                <th>Subject</th>
                <th>Category</th>
                <th>Priority</th>
                <th>AI</th>
