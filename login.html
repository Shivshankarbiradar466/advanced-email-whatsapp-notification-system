```html
{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <!-- Login Heading -->
                <h2 class="mb-4">
                    🔐 Login
                </h2>

                <!-- Login Form -->
                <form method="post">

                    <!-- Username -->
                    <label class="form-label">
                        Username
                    </label>

                    <input
                        name="username"
                        type="text"
                        class="form-control mb-3"
                        required
                    >


                    <!-- Password -->
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        name="password"
                        type="password"
                        class="form-control mb-3"
                        required
                    >


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>


                <!-- Registration Link -->
                <p class="mt-3 mb-0">

                    New user?

                    <a href="{{ url_for('register') }}">
                        Create account
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
