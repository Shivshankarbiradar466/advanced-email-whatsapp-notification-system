```html
{% extends "base.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <!-- Page Heading -->
                <h2 class="mb-4">
                    👤 Create Account
                </h2>

                <!-- Registration Form -->
                <form method="post">

                    <!-- Username -->
                    <label class="form-label">
                        Username
                    </label>

                    <input
                        name="username"
                        type="text"
                        class="form-control mb-3"
                        minlength="3"
                        required
                    >


                    <!-- Password -->
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        name="password"
                        type="password"
                        class="form-control mb-3"
                        minlength="8"
                        required
                    >


                    <!-- Confirm Password -->
                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        name="confirm_password"
                        type="password"
                        class="form-control mb-3"
                        required
                    >


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Register
                    </button>

                </form>


                <!-- Login Link -->
                <p class="mt-3 mb-0">

                    Already registered?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
